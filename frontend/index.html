<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Research Opportunity Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                Research Opportunity Portal
            </a>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3">Research Opportunities</h1>
                <p class="text-muted mb-0">
                    Explore and manage university research projects.
                </p>
            </div>

            <button class="btn btn-primary" id="showFormBtn">
                + Add Opportunity
            </button>
        </div>

        <div id="message" class="mb-3" role="alert"></div>

        <section id="formSection" class="card shadow-sm mb-4 d-none">
            <div class="card-body">
                <h2 class="h5 mb-3" id="formHeading">
                    Add Research Opportunity
                </h2>

                <form id="opportunityForm">
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label for="research_title" class="form-label">
                                Research Title *
                            </label>
                            <input type="text" class="form-control"
                                   id="research_title" required>
                        </div>

                        <div class="col-md-6">
                            <label for="research_area" class="form-label">
                                Research Area *
                            </label>
                            <input type="text" class="form-control"
                                   id="research_area" required>
                        </div>

                        <div class="col-12">
                            <label for="research_description" class="form-label">
                                Research Description *
                            </label>
                            <textarea class="form-control"
                                      id="research_description"
                                      rows="3" required></textarea>
                        </div>

                        <div class="col-md-6">
                            <label for="faculty_name" class="form-label">
                                Faculty Member *
                            </label>
                            <input type="text" class="form-control"
                                   id="faculty_name" required>
                        </div>

                        <div class="col-md-6">
                            <label for="department" class="form-label">
                                Department *
                            </label>
                            <input type="text" class="form-control"
                                   id="department" required>
                        </div>

                        <div class="col-md-6">
                            <label for="required_skills" class="form-label">
                                Required Skills *
                            </label>
                            <input type="text" class="form-control"
                                   id="required_skills" required>
                        </div>

                        <div class="col-md-6">
                            <label for="available_positions" class="form-label">
                                Available Positions *
                            </label>
                            <input type="number" class="form-control"
                                   id="available_positions"
                                   min="1" required>
                        </div>

                        <div class="col-md-6">
                            <label for="application_deadline" class="form-label">
                                Application Deadline *
                            </label>
                            <input type="date" class="form-control"
                                   id="application_deadline" required>
                        </div>

                        <div class="col-md-6">
                            <label for="status" class="form-label">
                                Status
                            </label>
                            <select class="form-select" id="status">
                                <option value="Open">Open</option>
                                <option value="Closed">Closed</option>
                            </select>
                        </div>

                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">
                            Save Opportunity
                        </button>
                        <button type="button" class="btn btn-secondary"
                                id="cancelFormBtn">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <section>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 mb-0">Available Research Projects</h2>
                <button class="btn btn-outline-secondary btn-sm"
                        id="refreshBtn">
                    Refresh
                </button>
            </div>

            <div id="opportunitiesList" class="row g-3">
                <p>Loading research opportunities...</p>
            </div>
        </section>
    </main>

    <footer class="text-center py-4 text-muted">
        University Research Opportunity Portal
    </footer>

    <script src="script.js"></script>
</body>
</html>
